<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — SpendSense</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body class="bg-[#F8FAFC] text-slate-900 min-h-screen flex flex-col antialiased selection:bg-purple-100 selection:text-purple-900 relative overflow-x-hidden">

  <!-- Header Navigation -->
  <header class="border-b border-slate-200/80 bg-white/80 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 h-18 flex items-center justify-between">
      <a href="index.html" class="flex items-center space-x-3 group">
        <div class="w-10 h-10 rounded-xl bg-slate-900 flex items-center justify-center text-white font-bold text-xl shadow-md group-hover:scale-105 transition-transform">
          S
        </div>
        <span class="font-extrabold text-xl tracking-tight text-slate-900">SpendSense</span>
      </a>

      <a href="login.html" class="text-sm font-bold text-slate-600 hover:text-slate-900 px-3.5 py-1.5 rounded-xl hover:bg-slate-100 transition-colors">
        Back to Login
      </a>
    </div>
  </header>

  <!-- Ambient Moving Doodles -->
  <div class="absolute top-24 left-10 opacity-70 pointer-events-none hidden md:block" data-doodle="sparkle"></div>
  <div class="absolute bottom-20 right-20 opacity-70 pointer-events-none hidden md:block" data-doodle="coin"></div>

  <!-- Main Forgot Password Container -->
  <main class="flex-grow flex items-center justify-center px-4 py-16 relative z-10">
    <div class="w-full max-w-md">
      
      <div class="tilt-card bg-white rounded-3xl border border-slate-200/80 p-8 shadow-xl relative overflow-hidden">
        
        <div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-purple-600 via-indigo-600 to-emerald-500"></div>

        <div class="w-12 h-12 rounded-2xl bg-purple-50 text-purple-700 flex items-center justify-center mx-auto mb-4 border border-purple-200/60 shadow-sm">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/></svg>
        </div>

        <div class="text-center mb-6">
          <h1 class="text-2xl font-black text-slate-900 tracking-tight">Forgot password?</h1>
          <p class="text-sm text-slate-500 mt-1">Enter your email and we'll send a secure link to reset your account password.</p>
        </div>

        <div id="auth-alert" class="hidden mb-5 p-3.5 rounded-xl text-sm border flex items-start space-x-3">
          <span id="auth-alert-icon" class="font-bold flex-shrink-0 mt-0.5"></span>
          <span id="auth-alert-message" class="flex-grow font-medium"></span>
        </div>

        <form id="form-forgot-password" class="space-y-4">
          <div>
            <label for="forgot-email" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Registered Email</label>
            <input id="forgot-email" type="email" required placeholder="you@example.com" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-purple-600 focus:bg-white transition-all">
          </div>

          <button id="btn-submit-forgot" type="submit" class="w-full py-3 rounded-xl font-bold text-white bg-slate-900 hover:bg-slate-800 transition-all shadow-md hover:shadow-lg flex items-center justify-center space-x-2">
            <span>Send Reset Instructions</span>
          </button>
        </form>

        <div id="forgot-success-box" class="hidden space-y-4 text-center py-2">
          <div class="w-12 h-12 rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center mx-auto text-xl">
            ✓
          </div>
          <h3 class="font-bold text-slate-900">Instructions Sent</h3>
          <p class="text-xs text-slate-600 leading-relaxed">
            If an account matches <span id="sent-target-email" class="font-bold text-slate-900"></span>, password reset instructions and a verification link have been dispatched.
          </p>
          <div class="pt-2">
            <a href="login.html" class="inline-block px-5 py-2 text-xs font-bold rounded-xl text-purple-700 bg-purple-50 hover:bg-purple-100 border border-purple-200 transition-colors">
              Return to Login
            </a>
          </div>
        </div>

        <div class="mt-6 pt-5 border-t border-slate-100 text-center">
          <a href="login.html" class="text-xs font-semibold text-slate-500 hover:text-slate-900 transition-colors">
            ← Back to Sign In
          </a>
        </div>

      </div>

    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("form-forgot-password");
      const emailInput = document.getElementById("forgot-email");
      const btnSubmit = document.getElementById("btn-submit-forgot");
      const successBox = document.getElementById("forgot-success-box");
      const targetEmailSpan = document.getElementById("sent-target-email");
      const alertBox = document.getElementById("auth-alert");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = emailInput.value.trim();
        if (!email) return;

        try {
          btnSubmit.disabled = true;
          btnSubmit.innerText = "Dispatching...";
          const res = await authAPI.forgotPassword({ email });
          
          targetEmailSpan.innerText = email;
          form.classList.add("hidden");
          successBox.classList.remove("hidden");
          showToast(res.message, "success");

        } catch (err) {
          alertBox.className = "mb-5 p-3.5 rounded-xl text-sm border flex items-start space-x-3 bg-rose-50 text-rose-800 border-rose-200";
          document.getElementById("auth-alert-message").innerText = err.message || "Failed to process request.";
          alertBox.classList.remove("hidden");
          btnSubmit.disabled = false;
          btnSubmit.innerText = "Send Reset Instructions";
        }
      });
    });
  </script>
</body>
</html>
